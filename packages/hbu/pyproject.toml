[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eon-hbu"
version = "0.1.1"
description = "Human Behavior Understanding for OVIC EON."
license = "Apache-2.0"
requires-python = ">=3.11,<3.13"
authors = [{ name = "OVIC Labs" }]
dependencies = [
    "eon-ere>=0.1.0,<0.2",
    "pydantic>=2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/eon_hbu"]
