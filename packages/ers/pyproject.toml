[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eon-ers"
version = "0.1.0"
description = "Emotion Recognition System (ERS) for OVIC EON — Emotional Intelligence Infrastructure for Robotics."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.13"
authors = [
    { name = "OVIC Labs", email = "engineering@oviclabs.com" },
]
keywords = [
    "robotics",
    "emotional-intelligence",
    "emotion-recognition",
    "affective-computing",
    "multimodal-fusion",
    "hri",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pillow>=9.5.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
ml = [
    "onnxruntime>=1.23.0",
    "onnx>=1.14.0",
]
live = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "websockets>=11.0",
    "python-multipart>=0.0.6",
    "httpx>=0.25.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "httpx>=0.25.0",
    "psutil>=5.9.0",
    "onnx>=1.14.0",
]

[project.scripts]
eon-ers-live = "eon_ers.live.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/eon_ers"]
