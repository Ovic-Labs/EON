[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eon-ems"
version = "0.1.0"
description = "Emotional Memory System for OVIC EON."
license = "Apache-2.0"
requires-python = ">=3.11,<3.13"
authors = [{ name = "OVIC Labs" }]
dependencies = [
    "cryptography>=42.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/eon_ems"]
