[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ovic-eon"
version = "0.1.0"
description = "Emotional Intelligence Infrastructure for Robotics."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10,<3.13"
authors = [
    { name = "OVIC Labs", email = "engineering@oviclabs.com" },
]
dependencies = [
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pillow>=9.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "onnxruntime>=1.15.0",
    "onnx>=1.14.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["packages/ers/tests"]
pythonpath = ["packages/ers/src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
mypy_path = "packages/ers/src"
packages = ["eon_ers"]
strict = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
ignore_missing_imports = true
