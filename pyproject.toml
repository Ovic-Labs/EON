[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ovic-eon"
version = "0.2.0"
description = "Emotional Intelligence Infrastructure for Robotics."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.13"
authors = [
    { name = "OVIC Labs", email = "engineering@oviclabs.com" },
]
dependencies = [
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pillow>=9.5.0",
    "cryptography>=42.0.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
studio = ["opencv-python-headless>=4.8,<5"]
ml = [
    "onnxruntime>=1.23.0",
    "onnx>=1.14.0",
]
live = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "websockets>=11.0",
    "python-multipart>=0.0.6",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "onnxruntime>=1.23.0",
    "onnx>=1.14.0",
]

[project.scripts]
eon-ers-studio = "ovic_eon.studio:main"
eon-ers-live = "eon_ers.live.cli:main"

[tool.hatch.build.targets.wheel]
packages = [
    "src/ovic_eon",
    "packages/ers/src/eon_ers",
    "packages/ems/src/eon_ems",
    "packages/ere/src/eon_ere",
    "packages/pse/src/eon_pse",
    "packages/sie/src/eon_sie",
    "packages/erg/src/eon_erg",
    "packages/hbu/src/eon_hbu",
]

[tool.hatch.build.targets.sdist]
include = [
    "/src/ovic_eon",
    "/packages/ers/src/eon_ers",
    "/packages/ems/src/eon_ems",
    "/packages/ere/src/eon_ere",
    "/packages/pse/src/eon_pse",
    "/packages/sie/src/eon_sie",
    "/packages/erg/src/eon_erg",
    "/packages/hbu/src/eon_hbu",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["packages/ers/tests"]
pythonpath = ["src", "packages/ers/src", "packages/ems/src", "packages/ere/src", "packages/pse/src", "packages/sie/src", "packages/erg/src", "packages/hbu/src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
mypy_path = "packages/ers/src"
packages = ["eon_ers"]
strict = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
ignore_missing_imports = true
