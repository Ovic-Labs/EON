name: Documentation Qualification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  markdown-lint:
    name: Markdown Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          config: .markdownlint.jsonc
          globs: "**/*.md"

  documentation-qualification:
    name: Documentation Qualification and Link Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Documentation Validation Suite
        run: |
          python scripts/validate_docs.py

  package-qualification:
    name: Package Test & Quality Gates (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install build

      - name: Run Ruff Lint and Format Checks
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Run Mypy Strict
        run: |
          python -m mypy src/eon

      - name: Run Pytest Suite with Coverage
        run: |
          python -m pytest --cov=eon --cov-report=term-missing

      - name: Verify Package Build
        run: |
          python -m build
