name: ERS CI

on:
  push:
    branches: ["main", "feature/**", "fix/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Lint, Typecheck & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pip-audit pydantic numpy scipy pillow cryptography onnxruntime onnx pytest pytest-asyncio pytest-cov build fastapi uvicorn websockets python-multipart httpx psutil

      - name: Run Ruff Lint
        run: ruff check .

      - name: Run Ruff Format Check
        run: ruff format --check .

      - name: Run Mypy
        run: mypy packages/ers/src

      - name: Run Dependency Vulnerability Audit
        run: pip-audit --desc

  test-and-build:
    name: Test & Build (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"

      - name: Install ERS and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/ers[dev,ml,live]"
          pip install build

      - name: Run Pytest Suite
        run: pytest packages/ers/tests -v --cov=eon_ers --cov-report=term-missing

      - name: Build Distribution Packages
        if: matrix.python-version == '3.11'
        run: python -m build packages/ers --outdir dist/
